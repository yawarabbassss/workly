<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Gradient & Mesh Pattern -->
  <rect width="1200" height="400" rx="16" fill="#090d16"/>
  <rect width="1200" height="400" rx="16" fill="url(#bg_radial)" fill-opacity="0.8"/>
  
  <defs>
    <!-- Radial lighting effect -->
    <radialGradient id="bg_radial" cx="50%" cy="30%" r="80%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Logo & Accent Gradients -->
    <linearGradient id="logo_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    
    <linearGradient id="node_trigger" x1="0" y1="0" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="node_ai" x1="0" y1="0" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e1065" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="node_action" x1="0" y1="0" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Grid Dots Background Pattern -->
  <g opacity="0.15">
    <circle cx="100" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="200" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="300" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="400" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="500" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="600" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="700" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="800" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="900" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="1000" cy="50" r="1.5" fill="#818cf8"/>
    <circle cx="1100" cy="50" r="1.5" fill="#818cf8"/>

    <circle cx="100" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="200" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="300" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="400" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="500" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="600" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="700" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="800" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="900" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="1000" cy="150" r="1.5" fill="#818cf8"/>
    <circle cx="1100" cy="150" r="1.5" fill="#818cf8"/>

    <circle cx="100" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="200" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="300" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="400" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="500" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="600" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="700" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="800" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="900" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="1000" cy="250" r="1.5" fill="#818cf8"/>
    <circle cx="1100" cy="250" r="1.5" fill="#818cf8"/>

    <circle cx="100" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="200" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="300" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="400" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="500" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="600" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="700" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="800" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="900" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="1000" cy="350" r="1.5" fill="#818cf8"/>
    <circle cx="1100" cy="350" r="1.5" fill="#818cf8"/>
  </g>

  <!-- Left Side: Branding, Title & Badges -->
  <g transform="translate(60, 60)">
    <!-- App Icon -->
    <rect width="56" height="56" rx="14" fill="url(#logo_grad)"/>
    <path d="M16 28L24 36L40 20" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Product Name -->
    <text x="72" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Workly</text>
    
    <!-- Tagline & Highlights -->
    <text x="0" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Production-Ready AI Workflow Automation SaaS</text>
    <text x="0" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Visually architect, synthesize with Multi-LLMs, and execute real actions with live telemetry.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1: Next.js 15 -->
      <rect width="100" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="50" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Next.js 15</text>

      <!-- Badge 2: React Flow -->
      <rect x="110" width="115" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="167" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">@xyflow/react</text>

      <!-- Badge 3: Multi-Provider AI -->
      <rect x="235" width="170" height="28" rx="8" fill="#311042" stroke="#6b21a8"/>
      <text x="320" y="18" fill="#d8b4fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Grok • Claude • GPT • Gemini</text>

      <!-- Badge 4: SSRF Protected -->
      <rect x="415" width="130" height="28" rx="8" fill="#064e3b" stroke="#047857"/>
      <text x="480" y="18" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SSRF Protected</text>
    </g>
  </g>

  <!-- Right Side: Workflow Node Diagram Illustration -->
  <g transform="translate(680, 50)">
    <!-- Connection Paths -->
    <path d="M 120 70 L 220 130" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 4"/>
    <path d="M 340 160 L 410 230" stroke="#10b981" stroke-width="2.5"/>

    <!-- Node 1: Webhook Trigger -->
    <g transform="translate(20, 20)">
      <rect width="190" height="65" rx="12" fill="url(#node_trigger)" stroke="#4338ca" stroke-width="1.5"/>
      <circle cx="28" cy="32" r="10" fill="#4f46e5"/>
      <text x="28" y="36" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">⚡</text>
      <text x="48" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Webhook Intake</text>
      <text x="48" y="46" fill="#818cf8" font-family="sans-serif" font-size="10">trigger.payload</text>
    </g>

    <!-- Node 2: Grok AI / Multi-LLM -->
    <g transform="translate(180, 110)">
      <rect width="200" height="70" rx="12" fill="url(#node_ai)" stroke="#7e22ce" stroke-width="1.5"/>
      <circle cx="28" cy="35" r="10" fill="#9333ea"/>
      <text x="28" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">✨</text>
      <text x="48" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Multi-LLM Reasoning</text>
      <text x="48" y="48" fill="#c084fc" font-family="sans-serif" font-size="10">Evaluate intent &amp; score</text>
    </g>

    <!-- Node 3: Real HTTP / Email Action -->
    <g transform="translate(290, 215)">
      <rect width="190" height="65" rx="12" fill="url(#node_action)" stroke="#059669" stroke-width="1.5"/>
      <circle cx="28" cy="32" r="10" fill="#10b981"/>
      <text x="28" y="36" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">✉️</text>
      <text x="48" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Send Email &amp; CRM Sync</text>
      <text x="48" y="46" fill="#34d399" font-family="sans-serif" font-size="10">Dispatched in 42ms</text>
    </g>
  </g>
</svg>
